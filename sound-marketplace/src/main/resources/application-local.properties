# Local standalone profile - runs with zero external services needed
spring.application.name=sound-marketplace-local

# Database Configuration (In-Memory H2 in MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:sound_marketplace_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# File Upload Configuration
app.upload.dir=uploads

# Security & Application Secrets
jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHktMzJieXRlcw==
stream.secret=test_stream_secret_32bytes_minimum
app.base.url=http://localhost:8080
cors.origins=http://localhost:3000

# Stripe Sandbox Mode (dummy test keys)
stripe.secret.key=sk_test_dummy
stripe.publishable.key=pk_test_dummy
stripe.webhook.secret=whsec_test_dummy
stripe.currency=usd

# Email Notification Configuration
app.mail.sender=${MAIL_SENDER:noreply@soundmarketplace.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
