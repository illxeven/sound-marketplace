spring.application.name=sound-marketplace
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sound_marketplace_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:sound_app_user}
spring.datasource.password=${DB_PASSWORD:sound_app_user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Existing DBs were migrated by hand up to V7 (see V7 file header); fresh DBs run V1..V7.
spring.flyway.baseline-version=7

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# Email Notification Configuration
app.mail.sender=${MAIL_SENDER:noreply@soundmarketplace.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Stripe Payment Gateway Configuration
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_dummy}
stripe.api.key=${stripe.secret.key}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_dummy}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_test_dummy}
stripe.currency=usd

# Security & Application Properties
jwt.secret=${JWT_SECRET:}
stream.secret=${STREAM_SECRET:}
app.base.url=${APP_BASE_URL:http://localhost:8080}
cors.origins=${CORS_ORIGINS:http://localhost:3000}

spring.application.ui.title=Sound Marketplace