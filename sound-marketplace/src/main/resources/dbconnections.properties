spring.application.name=sound-marketplace
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sound_marketplace_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=sound_app_user
spring.datasource.password=sound_app_user
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.application.ui.title=Sound Marketplace