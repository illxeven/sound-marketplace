spring.application.name=sound-marketplace-test
# Dedicated In-Memory Database for automated tests so MySQL database is NEVER wiped
spring.datasource.url=jdbc:h2:mem:sound_marketplace_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

# App properties
app.upload.dir=target/test-uploads

# Stripe Test Configuration
stripe.secret.key=sk_test_dummy
stripe.publishable.key=pk_test_dummy
stripe.webhook.secret=whsec_test_dummy
stripe.currency=usd

# Security & App Secrets for Tests
jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHktMzJieXRlcw==
stream.secret=test_stream_secret_32bytes_minimum
app.base.url=http://localhost:8080
cors.origins=http://localhost:3000

# Mail mock for tests
spring.mail.host=localhost
spring.mail.port=25
